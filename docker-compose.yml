services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lip_admin
      POSTGRES_PASSWORD: lip_password
      POSTGRES_DB: longevity_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lip_admin -d longevity_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkor_data:/var/lib/falkordb/data

volumes:
  postgres_data:
  falkor_data:
